name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      # registry-url は指定しない。指定すると setup-node が .npmrc へ
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # を書き、認証設定が存在する扱いになってOIDCの交換が行われない
      # (空の資格情報で公開しようとして PUT が 404 になる)。
      # 既定のレジストリが registry.npmjs.org なので指定は要らない。
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      # trusted publishing は npm 11.5.1 以降。Node同梱版に依存しないよう明示的に上げる
      - name: Use an npm that supports trusted publishing
        run: npm install --global npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check package
        run: pnpm check

      # 資格情報は渡さない。npm側に登録した公開元 (Repository / Workflow /
      # Environment) と一致すれば、OIDCの交換で公開できる
      - name: Publish
        run: npm publish
