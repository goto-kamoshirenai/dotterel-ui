name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      # registry-url を指定すると setup-node が
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # を .npmrc へ書く。この行がある以上、NODE_AUTH_TOKEN を渡さないと
      # 空の資格情報で公開しようとして PUT が 404 になる
      # (npmは権限不足を404で返す)。
      #
      # trusted publishing (OIDC) へ移す場合は、この registry-url と下の
      # NODE_AUTH_TOKEN の両方を外し、npm側で公開元を登録する (READMEを参照)。
      # 認証設定が残っているとOIDCの交換は行われない。
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check package
        run: pnpm check

      - name: Publish
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
