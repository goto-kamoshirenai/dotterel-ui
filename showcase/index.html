<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dotterel-ui showcase</title>
    <meta
      name="description"
      content="dotterel-ui の登録アイコン、コンポーネント、テーマ変数を探して試せるカタログ"
    />
    <script>
      // React 起動前にテーマを当てて初回描画のちらつきを防ぐ
      (function () {
        try {
          var stored = localStorage.getItem("dotterel-showcase-theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.setAttribute("data-dotterel-theme", stored);
          }
        } catch (error) {
          void error;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
